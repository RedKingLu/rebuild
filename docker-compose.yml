# rebuild — 平台容器化编排（Phase C1 基础编排 + C2 沙箱 scaffold）
#
# 快速启动：
#   cp .env.example .env   # 按需填入非敏感配置；密钥仍走各自的安全通道
#   docker compose up --build
#   前端 http://localhost:8080   后端 http://localhost:8000/api/health
#
# 默认用 SQLite（命名卷持久化），开箱即用、零外部依赖。
# 需要 PostgreSQL 时启用 profile：  docker compose --profile pg up --build
# 并在 .env 中设置 DATABASE_URL=postgresql+psycopg://rebuild:rebuild@db:5432/rebuild

services:
  backend:
    build:
      context: ./backend
    image: rebuild-backend:local
    environment:
      # 容器内路径；env_prefix=REBUILD_（见 backend/app/core/config.py）。
      # 端口标准：后端统一 8000；前端容器 8080。详见 06-容器化部署与执行隔离规范 §1.1。
      REBUILD_DATA_DIR: /app/.data
      REBUILD_DATABASE_URL: ${REBUILD_DATABASE_URL:-sqlite:////app/.data/rebuild.db}
      REBUILD_CORS_ORIGINS: ${REBUILD_CORS_ORIGINS:-http://localhost:8080}
      REBUILD_FRONTEND_URL: ${REBUILD_FRONTEND_URL:-http://localhost:8080}
      # OAuth 回调后端两套拓扑都在 8000，注册一次通用：
      REBUILD_GITHUB_REDIRECT_URI: ${REBUILD_GITHUB_REDIRECT_URI:-http://localhost:8000/api/integrations/git/oauth/github/callback}
      # 容器内执行模式（默认 local 宿主子进程；container 见下方 docker.sock opt-in）：
      EXECUTION_MODE: ${EXECUTION_MODE:-local}
    env_file:
      - path: .env       # 密钥（LLM_API_KEY 等）只经 env_file 注入，绝不写进镜像
        required: false
    volumes:
      - backend-data:/app/.data      # sqlite db + 执行沙箱 + 仓库克隆，持久化
    ports:
      - "8000:8000"
    restart: unless-stopped
    # ── 容器内执行（Phase C2，Q-R8-01 已裁决方案 A：docker-py）——默认关闭。 ──
    # 在 compose 启用受控容器执行需三步同时满足：
    #   1) 上方 environment 改为：  EXECUTION_MODE: container
    #   2) 取消注释下面的 docker.sock 挂载（L4：等同把宿主 Docker 控制权交给 backend，
    #      仅在可信单机环境启用；纵深防御与硬化基线见 06-容器化部署与执行隔离规范 §3）
    #   3) 先构建沙箱镜像：  docker compose --profile sandbox build execution-sandbox
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./frontend
    image: rebuild-frontend:local
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  # ── 可选：PostgreSQL（profile=pg）。默认不启动，保持开箱即用。 ──
  db:
    image: postgres:16-alpine
    profiles: ["pg"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rebuild}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rebuild}
      POSTGRES_DB: ${POSTGRES_DB:-rebuild}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # ── R15-4 独立社区服务（profile=community）。默认不启动，不影响主平台。 ──
  # 端口：community-backend 8001 / community-frontend 8081（登记入 06-容器化规范 §1.1）。
  # 独立 SQLite（命名卷 community-data），不共享主平台 DB。
  community-backend:
    build:
      context: ./community/backend
    image: rebuild-community-backend:local
    profiles: ["community"]
    environment:
      COMMUNITY_DATA_DIR: /app/.data
      COMMUNITY_DATABASE_URL: ${COMMUNITY_DATABASE_URL:-sqlite:////app/.data/community.db}
    volumes:
      - community-data:/app/.data
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/status',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  community-frontend:
    build:
      context: ./community/frontend
    image: rebuild-community-frontend:local
    profiles: ["community"]
    depends_on:
      - community-backend
    ports:
      - "8081:80"
    restart: unless-stopped

  # ── Phase C2 scaffold：执行沙箱镜像。默认只构建、不常驻（profile=sandbox）。 ──
  # 真实执行由 backend 通过短生命周期 exec/容器驱动；此处提供镜像与硬化基线。
  execution-sandbox:
    build:
      context: ./deploy/execution-sandbox
    image: rebuild-execution-sandbox:local
    profiles: ["sandbox"]
    read_only: true
    network_mode: "none"          # 沙箱无网络：不可外联代码托管/远程
    user: "10002:10002"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /work:size=256m,mode=1777
    restart: "no"

volumes:
  backend-data:
  pg-data:
  community-data:
